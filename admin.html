<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | F1 Tippspiel</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>⚙️ Adminbereich</h1>
</header>

<main>

    <nav class="adminMenu">

        <button class="menuButton active" data-page="players">
            Teilnehmer
        </button>

        <button class="menuButton" data-page="drivers">
            Fahrer
        </button>

        <button class="menuButton" data-page="events">
            Events
        </button>

        <button class="menuButton" data-page="results">
            Ergebnisse
        </button>

    </nav>

    <section id="playersPage" class="card page">

        <h2>Teilnehmer</h2>

        <input
            type="text"
            id="playerName"
            placeholder="Name eingeben">

        <button id="addPlayer">
            Teilnehmer hinzufügen
        </button>

        <ul id="playerList"></ul>

    </section>

    <section id="driversPage" class="card page hidden">

        <h2>Fahrer</h2>

        <input
            type="text"
            id="driverName"
            placeholder="Fahrer eingeben">

        <button id="addDriver">
            Fahrer hinzufügen
        </button>

        <ul id="driverList"></ul>

    </section>

    <section id="eventsPage" class="card page hidden">

        <h2>Events</h2>

        <select id="raceSelect"></select>

        <input
            type="datetime-local"
            id="deadline">

        <button id="saveRace">
            Event speichern
        </button>

        <ul id="eventList"></ul>

    </section>

    <section id="resultsPage" class="card page hidden">

        <h2>Ergebnisse</h2>

        <p>Kommt später.</p>

    </section>

</main>

<script type="module" src="js/admin.js"></script>

</body>
</html>
